<style>
:root{--bg:#FAFAF7;--surface:#FFF;--surface-2:#F3F2ED;--border:#E8E8E3;--border-strong:#CCCCC5;--text:#111110;--text-2:#555550;--text-3:#8B8B83;--accent:#3730A3;--accent-soft:#EEF0FF;--font-display:'Fraunces',Georgia,serif;--font-body:'Inter',system-ui,sans-serif;--radius:8px;--radius-lg:14px;--shadow:0 1px 3px rgba(0,0,0,.05),0 7px 28px rgba(0,0,0,.045);--shadow-hover:0 5px 12px rgba(0,0,0,.08),0 16px 34px rgba(0,0,0,.08)}
body.dark{--bg:#0F0F0E;--surface:#1A1A18;--surface-2:#20201D;--border:#2A2A26;--border-strong:#41413A;--text:#F0F0EB;--text-2:#ADADA4;--text-3:#77776E;--accent:#9AA2FF;--accent-soft:#20213B;--shadow:0 2px 14px rgba(0,0,0,.24);--shadow-hover:0 8px 28px rgba(0,0,0,.34)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;transition:background .25s,color .25s}.header{position:sticky;top:0;z-index:50;height:62px;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}.brand{display:flex;align-items:baseline;gap:.65rem}.brand-main{font-family:var(--font-display);font-size:1.16rem;font-weight:600;letter-spacing:.02em}.brand-sub{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}.header-actions{display:flex;align-items:center;gap:.55rem}.icon-btn,.install-btn{border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;transition:.15s}.icon-btn{width:38px;height:38px;border-radius:50%;font-size:1rem}.install-btn{display:none;border-radius:30px;padding:.55rem .9rem;font:500 .76rem var(--font-body)}.install-btn.visible{display:block}.icon-btn:hover,.install-btn:hover{border-color:var(--border-strong);color:var(--text)}main{max-width:1000px;margin:0 auto}.hero{padding:4.4rem 2rem 2.4rem}.hero-kicker{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:1rem}.hero h1{font-family:var(--font-display);font-size:clamp(2.25rem,5vw,3.8rem);font-weight:300;line-height:1.06;letter-spacing:-.035em;max-width:760px}.hero h1 em{font-weight:300}.hero-purpose{font-family:var(--font-display);font-size:clamp(1.15rem,2.5vw,1.48rem);font-weight:300;font-style:italic;color:var(--text-2);margin-top:1.15rem}.hero-desc{font-size:.94rem;color:var(--text-2);line-height:1.75;margin-top:.45rem}.search-wrap{padding:0 2rem 1.65rem}.search{position:relative;max-width:520px}.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}.search input{width:100%;padding:.78rem 2.7rem .78rem 2.5rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font:.9rem var(--font-body);outline:none;transition:.15s}.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}.search input::placeholder{color:var(--text-3)}.search-clear{display:none;position:absolute;right:7px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;background:transparent;color:var(--text-3);cursor:pointer;font-size:1rem}.search-clear.visible{display:block}.explore{padding:0 2rem 2rem;border-bottom:1px solid var(--border)}.explore-label{font-size:.7rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--text-3);margin-bottom:.75rem}.mode-row{display:flex;gap:.5rem;flex-wrap:wrap}.pill{border:1px solid var(--border);background:var(--surface);color:var(--text-2);border-radius:40px;padding:.46rem .86rem;font:500 .79rem var(--font-body);cursor:pointer;white-space:nowrap;transition:.15s}.pill:hover{border-color:var(--border-strong);color:var(--text)}.pill.active{background:var(--text);border-color:var(--text);color:var(--bg)}.explore-panel{display:none;margin-top:1rem;padding:1rem;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-lg)}.explore-panel.visible{display:block}.panel-title{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin-bottom:.75rem}.option-wrap{display:flex;flex-wrap:wrap;gap:.45rem}.option-btn{border:1px solid var(--border);background:var(--surface);color:var(--text-2);border-radius:40px;padding:.43rem .78rem;font:400 .78rem var(--font-body);cursor:pointer}.option-btn.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500}.subroute{margin-top:.9rem;padding-top:.9rem;border-top:1px solid var(--border)}.want-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}.want-btn{border:1px solid var(--border);background:var(--surface);color:var(--text-2);border-radius:var(--radius);padding:.78rem .9rem;text-align:left;font:400 .82rem/1.35 var(--font-body);cursor:pointer;transition:.15s}.want-btn:hover{border-color:var(--border-strong);color:var(--text)}.want-btn.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500}.results{padding:1.75rem 2rem 4rem}.result-state{min-height:28px;display:flex;align-items:center;flex-wrap:wrap;gap:.55rem;margin-bottom:1.25rem;font-size:.8rem;color:var(--text-3)}.result-state strong{color:var(--text);font-weight:600}.clear-filter{border:0;background:transparent;color:var(--accent);font:500 .76rem var(--font-body);cursor:pointer;padding:.2rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1.25rem}.card{display:flex;flex-direction:column;overflow:hidden;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);transition:.2s}.card:hover{transform:translateY(-3px);border-color:var(--border-strong);box-shadow:var(--shadow-hover)}.card-band{height:5px}.cover{height:126px;display:flex;align-items:center;justify-content:center;padding:1.3rem;position:relative;overflow:hidden}.cover::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.06),rgba(0,0,0,.08))}.cover-title{font-family:var(--font-display);font-size:1.08rem;font-style:italic;font-weight:600;color:rgba(255,255,255,.94);text-align:center;line-height:1.27;text-shadow:0 1px 5px rgba(0,0,0,.28);z-index:1}.card-body{display:flex;flex:1;flex-direction:column;gap:.58rem;padding:1.05rem 1.15rem 1.15rem}.author{font-size:.72rem;font-weight:600;letter-spacing:.055em;text-transform:uppercase;color:var(--text-3)}.title{font-family:var(--font-display);font-size:1.06rem;font-weight:400;line-height:1.32}.desc{font-size:.8rem;color:var(--text-2);line-height:1.58;flex:1}.card-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:.75rem;border-top:1px solid var(--border);padding-top:.75rem;margin-top:.15rem}.tags{display:flex;gap:.35rem;flex-wrap:wrap}.tag{font-size:.67rem;font-weight:500;color:var(--accent);background:var(--accent-soft);border-radius:30px;padding:.18rem .5rem}.mins{font-size:.7rem;color:var(--text-3);white-space:nowrap}.empty{display:none;text-align:center;padding:5rem 1rem;color:var(--text-3)}.empty.visible{display:block}.empty h2{font-family:var(--font-display);font-weight:300;font-style:italic;color:var(--text-2);margin-bottom:.45rem}.footer{border-top:1px solid var(--border);padding:1.5rem 1rem;text-align:center;color:var(--text-3);font-size:.75rem}
@media(max-width:650px){.header{padding:0 1rem}.brand-sub{display:none}.hero{padding:2.8rem 1rem 1.7rem}.search-wrap,.explore{padding-left:1rem;padding-right:1rem}.mode-row{overflow-x:auto;flex-wrap:nowrap;padding-bottom:.25rem;scrollbar-width:none}.mode-row::-webkit-scrollbar{display:none}.explore-panel{padding:.85rem}.want-list{grid-template-columns:1fr}.results{padding:1.4rem 1rem 3rem}.grid{grid-template-columns:1fr 1fr;gap:.8rem}.cover{height:92px}.cover-title{font-size:.86rem}.card-body{padding:.8rem .9rem .9rem}.desc{display:none}.title{font-size:.93rem}.card-foot{align-items:flex-start;flex-direction:column}.mins{align-self:flex-end}.install-btn{font-size:0;padding:.5rem;width:38px;height:38px}.install-btn::after{content:'+';font-size:1.2rem}}
@media(max-width:385px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header">
  <div class="brand"><span class="brand-main">BOOKCLUB</span></div>
  <div class="header-actions"><button id="btn-install" class="install-btn" type="button">Instalar BOOKCLUB</button><button id="btn-dark" class="icon-btn" type="button" aria-label="Cambiar apariencia">☽</button></div>
</header>
<main>
  <section class="hero">
    <div class="hero-kicker">Ideas que vale la pena conservar.</div>
    <h1>Descubre qué merece tu <em>tiempo de lectura.</em></h1>
    <p class="hero-purpose">Una biblioteca de libros para pensar, crecer y enseñar.</p>
  </section>
  <section class="search-wrap">
    <div class="search"><span class="search-icon">⌕</span><input id="search-input" type="search" placeholder="Buscar por título o autor…" autocomplete="off"><button id="search-clear" class="search-clear" type="button" aria-label="Borrar búsqueda">×</button></div>
  </section>
  <section class="explore">
    <div class="explore-label">Explorar por</div>
    <div class="mode-row" id="mode-row">
      <button class="pill active" data-mode="todos">TODOS</button>
      <button class="pill" data-mode="ruta">RUTA</button>
      <button class="pill" data-mode="autor">AUTOR</button>
      <button class="pill" data-mode="tema">TEMA</button>
      <button class="pill" data-mode="quiero">QUIERO…</button>
    </div>
    <div id="explore-panel" class="explore-panel"></div>
  </section>
  <section class="results">
    <div id="result-state" class="result-state">Cargando…</div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty"><h2>No encontramos libros para esta búsqueda.</h2><p>Prueba otro término o vuelve a Todos.</p></div>
  </section>
</main>
<footer class="footer">BOOKCLUB · Ideas que vale la pena conservar.</footer>
<script>
(function(){
'use strict';
var libros=[],mode='todos',selection=null,routeMajor=null,search='';
var labelsExp={mentalidad:'Mentalidad',capacidad:'Capacidad',habilidad:'Habilidad'};
var labelsSub={identidad:'Identidad',sanidad:'Sanidad',renovacion:'Renovación',espiritual:'Inteligencia Espiritual',emocional:'Inteligencia Emocional',fisica:'Inteligencia Física',personal:'Personal',relacional:'Relacional',vocacional:'Vocacional'};
var routeSubs={mentalidad:['identidad','sanidad','renovacion'],capacidad:['espiritual','emocional','fisica'],habilidad:['personal','relacional','vocacional']};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function unique(arr){return Array.from(new Set(arr)).sort(function(a,b){return a.localeCompare(b,'es',{sensitivity:'base'});});}
function setMode(m){mode=m;selection=null;routeMajor=null;document.querySelectorAll('[data-mode]').forEach(function(b){b.classList.toggle('active',b.dataset.mode===m);});renderPanel();render();}
function selectValue(v){selection=v;renderPanel();render();}
function selectRouteMajor(v){routeMajor=v;selection=null;renderPanel();render();}
function renderPanel(){var p=document.getElementById('explore-panel');if(mode==='todos'){p.className='explore-panel';p.innerHTML='';return;}p.className='explore-panel visible';var h='';if(mode==='ruta'){h='<div class="panel-title">Ruta formativa</div><div class="option-wrap">'+['mentalidad','capacidad','habilidad'].map(function(x){return '<button class="option-btn '+(routeMajor===x?'active':'')+'" data-route="'+x+'">'+labelsExp[x]+'</button>';}).join('')+'</div>';if(routeMajor){h+='<div class="subroute"><div class="panel-title">'+labelsExp[routeMajor]+'</div><div class="option-wrap"><button class="option-btn '+(selection===null?'active':'')+'" data-subroute="">Todas</button>'+routeSubs[routeMajor].map(function(x){return '<button class="option-btn '+(selection===x?'active':'')+'" data-subroute="'+x+'">'+labelsSub[x]+'</button>';}).join('')+'</div></div>';}}
if(mode==='autor'){var vals=unique(libros.map(function(l){return l.autor;}));h='<div class="panel-title">Autores</div><div class="option-wrap">'+vals.map(function(v){return '<button class="option-btn '+(selection===v?'active':'')+'" data-select="'+esc(v)+'">'+esc(v)+'</button>';}).join('')+'</div>';}
if(mode==='tema'){var temas=unique(libros.flatMap(function(l){return l.temas||[];}));h='<div class="panel-title">Temas</div><div class="option-wrap">'+temas.map(function(v){return '<button class="option-btn '+(selection===v?'active':'')+'" data-select="'+esc(v)+'">'+esc(v)+'</button>';}).join('')+'</div>';}
if(mode==='quiero'){var wants=unique(libros.flatMap(function(l){return l.quiero||[];}));h='<div class="panel-title">¿Qué quieres trabajar?</div><div class="want-list">'+wants.map(function(v){return '<button class="want-btn '+(selection===v?'active':'')+'" data-select="'+esc(v)+'">'+esc(v)+'</button>';}).join('')+'</div>';}
p.innerHTML=h;}
function matches(l){if(search&&!(norm(l.titulo+' '+l.autor).includes(norm(search))))return false;if(mode==='ruta'){if(routeMajor&&l.expedicion!==routeMajor)return false;if(selection&&l.sub_expedicion!==selection)return false;}if(mode==='autor'&&selection&&l.autor!==selection)return false;if(mode==='tema'&&selection&&!(l.temas||[]).includes(selection))return false;if(mode==='quiero'&&selection&&!(l.quiero||[]).includes(selection))return false;return true;}
function stateText(total){var bits=[];if(mode==='ruta'&&routeMajor){bits.push(labelsExp[routeMajor]+(selection?' → '+labelsSub[selection]:''));}else if(mode==='autor'&&selection){bits.push('Autor: '+selection);}else if(mode==='tema'&&selection){bits.push('Tema: '+selection);}else if(mode==='quiero'&&selection){bits.push('Quiero: '+selection);}if(search)bits.push('buscando “'+search+'”');var prefix=bits.length?'<strong>'+esc(bits.join(' · '))+'</strong> · ':'';var clear=(mode!=='todos'&&(routeMajor||selection))?' <button class="clear-filter" id="clear-filter">Limpiar filtro</button>':'';return prefix+'<strong>'+total+'</strong> '+(total===1?'libro':'libros')+clear;}
function card(l){var grad='linear-gradient(145deg,'+l.color_portada_inicio+' 0%,'+l.color_portada_fin+' 100%)';return '<a class="card" href="'+esc(l.archivo)+'" target="_blank" rel="noopener noreferrer"><div class="card-band" style="background:'+esc(l.color_acento)+'"></div><div class="cover" style="background:'+grad+'"><div class="cover-title">'+esc(l.titulo)+'</div></div><div class="card-body"><div class="author">'+esc(l.autor)+' · '+esc(l.anio)+'</div><div class="title">'+esc(l.titulo)+'</div><div class="desc">'+esc(l.descripcion)+'</div><div class="card-foot"><div class="tags"><span class="tag">'+esc(labelsExp[l.expedicion]||'')+'</span><span class="tag">'+esc(labelsSub[l.sub_expedicion]||'')+'</span></div><div class="mins">'+esc(l.tiempo_lectura_min)+' min</div></div></div></a>';}
function render(){var filtered=libros.filter(matches),g=document.getElementById('grid'),e=document.getElementById('empty'),s=document.getElementById('result-state');s.innerHTML=stateText(filtered.length);if(filtered.length){g.innerHTML=filtered.map(card).join('');e.classList.remove('visible');}else{g.innerHTML='';e.classList.add('visible');}var c=document.getElementById('clear-filter');if(c)c.onclick=function(){selection=null;routeMajor=null;renderPanel();render();};}
document.getElementById('mode-row').addEventListener('click',function(e){var b=e.target.closest('[data-mode]');if(b)setMode(b.dataset.mode);});
document.getElementById('explore-panel').addEventListener('click',function(e){var r=e.target.closest('[data-route]');if(r){selectRouteMajor(r.dataset.route);return;}var sr=e.target.closest('[data-subroute]');if(sr){selectValue(sr.dataset.subroute||null);return;}var s=e.target.closest('[data-select]');if(s)selectValue(s.dataset.select);});
var inp=document.getElementById('search-input'),clr=document.getElementById('search-clear');inp.addEventListener('input',function(){search=this.value.trim();clr.classList.toggle('visible',!!search);render();});clr.addEventListener('click',function(){inp.value='';search='';clr.classList.remove('visible');inp.focus();render();});
function applyTheme(dark){document.body.classList.toggle('dark',dark);document.getElementById('btn-dark').textContent=dark?'☀':'☽';document.getElementById('theme-color-meta').setAttribute('content',dark?'#0F0F0E':'#FAFAF7');localStorage.setItem('bookclub-theme',dark?'dark':'light');}
var saved=localStorage.getItem('bookclub-theme');applyTheme(saved==='dark'||(!saved&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches));document.getElementById('btn-dark').addEventListener('click',function(){applyTheme(!document.body.classList.contains('dark'));});
var installPrompt=null,ib=document.getElementById('btn-install');window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();installPrompt=e;ib.classList.add('visible');});ib.addEventListener('click',async function(){if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;ib.classList.remove('visible');});window.addEventListener('appinstalled',function(){ib.classList.remove('visible');installPrompt=null;});
fetch('libros.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error();return r.json();}).then(function(d){libros=d.libros||[];renderPanel();render();}).catch(function(){document.getElementById('result-state').textContent='No se pudo cargar la biblioteca.';document.getElementById('empty').classList.add('visible');});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>
</body>
</html>
