<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B0C10">
  <title>BOOKCLUB · Acceso</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0B0C10;color:#EDEDF2;font-family:system-ui,sans-serif}.status{font-size:.78rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#9A90FF}.error{max-width:28rem;padding:1.5rem;text-align:center;line-height:1.5;color:#C7C7D1}.error a{color:#9A90FF}
  </style>
</head>
<body>
  <p class="status" id="status">Abriendo Google…</p>
  <script>
    (async function(){
      var status=document.getElementById('status');
      try{
        var client=window.supabase.createClient('https://dgllysqskzpjtmflfnew.supabase.co','sb_publishable_In8S8O4wx4mPdR75-jrRSg_fu6MWbqv',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
        var result=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://bookclublhscol.netlify.app/biblioteca/?open=biblioteca'}});
        if(result.error)throw result.error;
      }catch(error){
        status.className='error';
        status.innerHTML='No fue posible abrir Google. <a href="/">Volver a BookClub</a>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
