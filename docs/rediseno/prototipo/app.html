<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BOOKCLUB Prototipo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>[hidden]{display:none!important}img{max-width:100%}
/* Layout: una sola app con tres vistas (landing, Disponibles, Mi Biblioteca) bajo la barra de El College; tokens del sistema BOOKCLUB v2. */
:root{
  --bg:#0b0c10;--surface:#15171e;--sunk:#101217;--line:#23262f;--line-2:#626a7c;
  --ink:#eceef3;--ink-2:#a6acb9;--ink-3:#8a90a0;
  --accent:#9ca0ff;--accent-soft:#1c1e3a;--on-accent:#0b0c10;
  --lumbre:#f2c879;--lumbre-soft:#2a2214;--on-lumbre:#17120a;--halo:rgba(242,200,121,.16);--estante:#2b251d;
  --lift:0 2px 4px rgba(0,0,0,.5),0 16px 30px -10px rgba(0,0,0,.7);
  --float:0 24px 60px -12px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06);
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-sm:6px;--r-md:10px;--r-lg:16px;--pill:99px;--ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f4f1ea;--surface:#fffdf8;--sunk:#eae5da;--line:#ddd6c8;--line-2:#8f8778;
  --ink:#17171a;--ink-2:#4a4b52;--ink-3:#62646c;--accent:#3b3fd8;--accent-soft:#e7e8fb;--on-accent:#fff;
  --lumbre:#8a5a0b;--lumbre-soft:#f6ebd3;--on-lumbre:#fff;--halo:rgba(138,90,11,.07);--estante:#cbbfa6;
  --lift:0 2px 4px rgba(20,22,28,.10),0 14px 28px -10px rgba(20,22,28,.28);
  --float:0 24px 60px -16px rgba(60,44,20,.35),0 0 0 1px rgba(23,23,26,.06);color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f4f1ea;--surface:#fffdf8;--sunk:#eae5da;--line:#ddd6c8;--line-2:#8f8778;
  --ink:#17171a;--ink-2:#4a4b52;--ink-3:#62646c;--accent:#3b3fd8;--accent-soft:#e7e8fb;--on-accent:#fff;
  --lumbre:#8a5a0b;--lumbre-soft:#f6ebd3;--on-lumbre:#fff;--halo:rgba(138,90,11,.07);--estante:#cbbfa6;
  --lift:0 2px 4px rgba(20,22,28,.10),0 14px 28px -10px rgba(20,22,28,.28);
  --float:0 24px 60px -16px rgba(60,44,20,.35),0 0 0 1px rgba(23,23,26,.06);color-scheme:light}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:400 16px/1.55 var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--bg)}
h1,h2,h3{font-family:var(--serif);font-weight:400;text-wrap:balance;margin:0}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.lead{font-size:1.05rem;color:var(--ink-2);max-width:62ch}
.frase{font-family:var(--serif);font-style:italic;font-size:clamp(1.05rem,2vw,1.3rem);color:var(--lumbre)}
.luz{color:var(--lumbre)}

/* Botones */
.btn{display:inline-flex;align-items:center;gap:.55rem;border-radius:var(--pill);padding:.8rem 1.4rem;font:600 .95rem/1.2 var(--sans);text-decoration:none;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--lift)}
.btn svg{transition:transform .15s}.btn:hover svg{transform:translateX(3px)}
.btn[aria-busy="true"]{opacity:.75;pointer-events:none}
.btn-2{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn-2:hover{border-color:var(--ink)}
.link{font:600 .95rem/1.2 var(--sans);color:var(--accent);text-decoration:none;border:0;border-bottom:1px solid transparent;padding:0 0 1px;background:none;cursor:pointer}
.link:hover{border-bottom-color:var(--accent)}
.cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.6rem}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{border-color:var(--ink);color:var(--ink)}

/* Barra El College */
.header{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--bg);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:12px 28px;min-height:62px;padding-block:8px}
.brand{display:flex;align-items:center;gap:.6rem;font:600 1.2rem/1 var(--serif);letter-spacing:.06em;text-decoration:none;color:var(--ink);flex-shrink:0;background:none;border:0;cursor:pointer;padding:0}
.mark{width:22px;height:22px;display:flex;align-items:flex-end;gap:2px}
.mark i{display:block;width:5px;background:var(--ink);border-radius:1px}
.mark i:nth-child(1){height:70%}.mark i:nth-child(2){height:100%;background:var(--accent)}.mark i:nth-child(3){height:55%}
.hnav{display:flex;gap:6px 30px;font:700 12px/1.55 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.hnav a{color:var(--ink-2);text-decoration:none;padding:6px 0}
.hnav a:hover{color:var(--accent)}
.hnav a[aria-current="page"]{color:var(--accent);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:8px}
.hright{display:flex;align-items:center;gap:.6rem}
.hcta{display:inline-flex;align-items:center;gap:.5rem;min-height:42px;padding:0 22px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font:700 14px/1 var(--sans);white-space:nowrap;cursor:pointer;transition:transform .15s,box-shadow .15s}
.hcta:hover{transform:translateY(-1px);box-shadow:var(--lift)}
.hcta[aria-busy="true"]{opacity:.75}
.hburger{display:none;width:44px;height:44px;border:0;background:none;color:var(--ink);cursor:pointer;align-items:center;justify-content:center}
.subnav{display:flex;gap:4px;padding-bottom:10px;overflow-x:auto}
.subnav button{border:0;background:none;padding:.5rem .9rem;border-radius:var(--pill);font:600 .88rem/1 var(--sans);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.subnav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.cuenta{position:relative}
.cuenta-btn{display:inline-flex;align-items:center;gap:.55rem;min-height:42px;padding:0 14px 0 5px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:600 14px/1 var(--sans);cursor:pointer}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:700 13px/1 var(--sans)}
.cuenta-menu{position:absolute;right:0;top:calc(100% + 8px);min-width:250px;padding:16px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--float);display:grid;gap:.75rem;z-index:5}
.cuenta-menu .quien b{display:block;font-weight:600}
.cuenta-menu .quien span{font-size:.82rem;color:var(--ink-3)}
.cuenta-menu hr{border:0;border-top:1px solid var(--line);margin:0}
.cuenta-menu button{font:500 .92rem/1.3 var(--sans);text-align:left;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
@media(max-width:1000px){
  .hnav{display:none;order:3;flex-basis:100%;flex-direction:column;gap:0;padding:4px 0 14px}
  .header.open .hnav{display:flex}
  .hnav a{padding:14px 2px;border-bottom:1px solid var(--line)}
  .hbar{flex-wrap:wrap}
  .hburger{display:inline-flex}
  .hcta{padding:0 16px}
}
@media(max-width:640px){.hbar{gap:8px 8px}.hright{gap:.4rem}.hcta{padding:0 14px;font-size:13px}}
@media(max-width:420px){.brand{font-size:1.05rem;gap:.45rem}.cuenta-btn .nombre{display:none}.cuenta-btn{padding:0 5px}}

/* Insignias */
.insignia{display:inline-flex;align-items:center;gap:.35rem;border-radius:var(--r-sm);padding:.28rem .55rem;font:700 11px/1.3 var(--sans);letter-spacing:.1em;text-transform:uppercase;border:1px solid transparent;white-space:nowrap}
.insignia.free{color:var(--ink-2);border-color:var(--line-2)}
.insignia.premium{color:var(--accent);background:var(--accent-soft)}
.insignia.vip{color:var(--lumbre);background:var(--lumbre-soft)}
.insignia.gratis{color:var(--on-lumbre);background:var(--lumbre)}
.insignia.estado{color:var(--ink-2);background:var(--sunk)}
.tag{align-self:flex-start;font-size:.72rem;font-weight:500;color:var(--accent);background:var(--accent-soft);border-radius:var(--pill);padding:.2rem .65rem}

/* Portadas */
.book{display:flex;flex-direction:column;gap:.75rem;min-width:0;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.cover{position:relative;aspect-ratio:3/4;width:100%;max-width:100%;border-radius:3px 8px 8px 3px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.25),0 10px 22px -12px rgba(0,0,0,.6);transition:transform .3s var(--ease),box-shadow .3s;background:var(--sunk)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cover::before{content:'';position:absolute;inset:0 auto 0 0;width:12px;z-index:1;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.1) 60%,transparent)}
.cover::after{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(160deg,rgba(255,255,255,.12),transparent 45%,rgba(0,0,0,.18));pointer-events:none}
.book:hover .cover{transform:translateY(-6px) rotate(-.4deg);box-shadow:var(--lift)}
.cover .insignia{position:absolute;top:10px;right:10px;z-index:2}
.book-title{font:500 1.02rem/1.2 var(--serif)}
.book-line{display:flex;justify-content:space-between;gap:.6rem;font-size:.82rem;color:var(--ink-3)}
.book-line b{color:var(--ink);font-weight:600}
.book.cerrado .cover img{filter:saturate(.35) brightness(.5)}
.candado{position:absolute;inset:auto 0 0 0;z-index:2;display:flex;align-items:center;gap:.45rem;padding:.6rem .75rem;background:rgba(11,12,16,.85);color:#eceef3;font:600 .78rem/1.3 var(--sans)}
.progreso{height:4px;border-radius:var(--r-sm);background:var(--line);overflow:hidden}
.progreso i{display:block;height:100%;background:var(--accent);border-radius:inherit}

/* Landing */
.view{animation:entra .35s var(--ease)}
@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:2.5rem 3.5rem;align-items:end;padding-block:clamp(2.5rem,7vw,5rem) clamp(2rem,5vw,3.5rem)}
.hero h1{font-size:clamp(2.6rem,6.4vw,4.9rem);line-height:.98;letter-spacing:-.03em;font-variation-settings:'opsz' 72;margin:14px 0 22px;max-width:11ch}
.hero .cta-row{margin-top:30px}
.hero .nota{margin-top:14px;font-size:.82rem;color:var(--ink-3)}
.shelf-col{position:relative;min-width:0}
.halo{position:absolute;pointer-events:none;inset:-30% -15% 10%;background:radial-gradient(closest-side,var(--halo),transparent)}
.shelf{--s:1;position:relative;display:flex;align-items:flex-end;justify-content:flex-end;gap:5px;height:calc(300px*var(--s));border-bottom:6px solid var(--estante);box-shadow:0 3px 0 -1px var(--ink-3)}
.spine{position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 auto;height:calc(var(--h)*1px*var(--s));width:calc(var(--w)*1px*var(--s));border-radius:3px 3px 1px 1px;overflow:hidden;animation:rise .7s var(--ease) backwards;animation-delay:calc(var(--i)*70ms);border:0;padding:0;cursor:pointer;transition:transform .3s var(--ease)}
.spine:hover{transform:translateY(-8px)}
.spine::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.16),transparent 22%,transparent 78%,rgba(0,0,0,.22))}
.spine span{position:relative;writing-mode:vertical-rl;transform:rotate(180deg);font:500 calc(.92rem*var(--s))/1 var(--serif);letter-spacing:.02em;white-space:nowrap;max-height:90%;overflow:hidden;text-overflow:ellipsis;color:var(--tx,#fff)}
.spine.pronto{background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);cursor:default}
.spine.pronto:hover{transform:none}
.spine.pronto span{color:var(--ink-3);font-style:italic}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.shelf-note{margin-top:.9rem;font-size:.78rem;color:var(--ink-3);text-align:right}
.band{border-top:1px solid var(--line)}
.sec{padding-block:clamp(3rem,7vw,5.5rem)}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.5rem 3.5rem;align-items:start}
.sec-head h2{font-size:clamp(1.9rem,4vw,3rem);line-height:1.05;letter-spacing:-.02em;margin-top:12px;max-width:16ch}
.cita{margin-top:2.6rem;display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.2rem;align-items:start;max-width:760px}
.cita svg{flex:none}
.cita p{font:italic clamp(1.3rem,2.6vw,1.75rem)/1.35 var(--serif);color:var(--ink)}
.cita small{display:block;margin-top:.6rem;font:600 .78rem/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--lumbre)}
.steps{margin:2.8rem 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2.2rem}
.step{border-top:3px solid var(--ink);padding-top:1.2rem}
.step .n{display:block;font:italic 1.05rem/1 var(--serif);color:var(--accent);margin-bottom:.7rem}
.step h3{font-size:1.8rem;font-weight:500;letter-spacing:-.01em;margin-bottom:.5rem}
.step p{color:var(--ink-2);font-size:.97rem}
.close{padding-block:clamp(3.5rem,9vw,7rem);position:relative;overflow:hidden}
.close h2{font-size:clamp(2.1rem,5vw,3.7rem);line-height:1.02;letter-spacing:-.025em;max-width:18ch}
.close .lead{margin-top:1.3rem}.close .cta-row{margin-top:2rem}
.close .halo{inset:-40% -20% -20% 40%}
.close > *{position:relative}

/* Disponibles */
.pagina{padding-block:clamp(1.8rem,4vw,3rem) 4rem;display:grid;gap:2.6rem}
.top{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap}
.top h2{font-size:clamp(1.9rem,4vw,3rem);line-height:1.05;letter-spacing:-.02em;margin-top:10px}
.sim{display:grid;gap:6px;justify-items:end}
.sim small{font-size:.74rem;color:var(--ink-3)}
.seg{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--line-2)}
.seg button{border:0;background:none;padding:.45rem .9rem;border-radius:999px;font:600 .82rem/1 var(--sans);color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.empieza{position:relative;display:grid;grid-template-columns:170px minmax(0,1fr);gap:1.6rem 2rem;align-items:center;padding:clamp(1.2rem,3vw,2rem);border-radius:var(--r-lg);background:var(--lumbre-soft);overflow:hidden}
.empieza .halo{inset:-60% 40% -20% -30%}
.empieza > :not(.halo){position:relative;min-width:0}
.empieza h3{font:500 clamp(1.8rem,3.4vw,2.4rem)/1.05 var(--serif);margin:12px 0 10px}
.empieza .cta-row{margin-top:18px}
.meta{font-size:.82rem;color:var(--ink-3)}
.pasillo{display:grid;gap:1rem}
.pasillo-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;border-top:1px solid var(--line);padding-top:1rem}
.pasillo-head h3{font:500 30px/1.1 var(--serif);letter-spacing:-.01em}
.pasillo-head .sub{display:block;font-size:.82rem;color:var(--ink-3);margin-top:4px}
.pasillo-head > span{font-size:.82rem;color:var(--ink-3);white-space:nowrap}
.riel{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,180px);gap:1.4rem;overflow-x:auto;padding:8px 2px 12px;scrollbar-width:thin}

/* Mi Biblioteca */
.estante{position:relative;padding-top:72px;border-radius:var(--r-lg);background:var(--sunk);overflow:hidden}
.lampara{position:absolute;left:50%;top:0;transform:translateX(-50%);width:120px;height:46px}
.lampara .lc{stroke:var(--ink-3)}.lampara .ls{fill:var(--ink-3)}.lampara .lb{fill:var(--lumbre)}
.estante > .halo{inset:-50% 5% 15%}
.fila{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:8px;min-height:290px;padding:0 24px;overflow-x:auto;scrollbar-width:none;transition:padding .5s var(--ease)}
.fila.abierta{padding-left:min(560px,58%)}
.tabla{height:14px;background:var(--estante);box-shadow:inset 0 2px 0 var(--ink-3),0 18px 30px -12px rgba(0,0,0,.6)}
.lomo{position:relative;flex:none;height:calc(var(--h)*1px);width:calc(var(--w)*1px);border:0;padding:0;border-radius:3px 3px 1px 1px;cursor:pointer;overflow:hidden;transform-origin:50% 100%;transition:transform .45s var(--ease),filter .3s;box-shadow:inset -3px 0 6px rgba(0,0,0,.25)}
.lomo::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.18),transparent 25%,transparent 75%,rgba(0,0,0,.25))}
.lomo span{position:absolute;inset:10px 0;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font:500 .88rem/1 var(--serif);letter-spacing:.02em;white-space:nowrap;overflow:hidden;color:var(--tx,#fff)}
.cinta{position:absolute;left:50%;top:-1px;width:8px;height:22px;transform:translateX(-50%);background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.lomo:hover{transform:translateY(-10px)}
.fila.abierta .lomo{filter:brightness(.45) saturate(.6)}
.fila.abierta .lomo.fuera{filter:none;transform:translateY(-34px) rotate(-2deg)}
.ficha{position:absolute;left:24px;top:24px;z-index:4;display:grid;grid-template-columns:180px minmax(0,270px);gap:24px;align-items:center;padding:24px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--float);perspective:1000px}
.ficha .cover{width:180px;transform-origin:0 50%;animation:girar .7s var(--ease) both}
.ficha .info{display:grid;gap:.55rem;align-content:start;animation:aparecer .5s .25s var(--ease) both}
.ficha h3{font:500 1.5rem/1.15 var(--serif)}
.ficha .info p{font-size:.86rem;color:var(--ink-3)}
.ficha .acciones{display:flex;flex-wrap:wrap;gap:.7rem 1.2rem;align-items:center;margin-top:6px}
@keyframes girar{from{transform:rotateY(-88deg) translateY(30px);box-shadow:none}to{transform:none}}
@keyframes aparecer{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pista{padding:14px 0 18px;text-align:center;font:italic .95rem var(--serif);color:var(--ink-3)}
.clasica{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2rem 1.4rem}
.vacio{padding:3rem 1.5rem;text-align:center;display:grid;gap:1rem;justify-items:center;color:var(--ink-2)}
.vacio h3{font-size:1.6rem;color:var(--ink)}

/* Hoja del libro (Disponibles) */
.velo{position:fixed;inset:0;z-index:95;background:rgba(5,6,8,.6);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.hoja{position:relative;width:min(760px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;padding:28px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--float);animation:aparecer .3s var(--ease)}
.hoja h3{font:500 2rem/1.08 var(--serif);margin:10px 0 6px}
.hoja .desc{color:var(--ink-2);margin:14px 0 18px}
.hoja .cerrar{position:absolute;top:12px;right:12px}
.planbox{margin-top:16px;padding:14px 16px;border-radius:var(--r-md);background:var(--accent-soft);font-size:.92rem;display:grid;gap:10px}

/* Aviso */

/* Arrastrar con el mouse (sin barras) */
function arrastre(el){var x0,s0,mov=false,down=false;
 el.addEventListener('pointerdown',function(e){if(e.pointerType!=='mouse')return;down=true;mov=false;x0=e.clientX;s0=el.scrollLeft});
 window.addEventListener('pointermove',function(e){if(!down)return;var dx=e.clientX-x0;if(Math.abs(dx)>4){mov=true;el.classList.add('arrastra')}if(mov)el.scrollLeft=s0-dx});
 window.addEventListener('pointerup',function(){if(!down)return;down=false;setTimeout(function(){el.classList.remove('arrastra')},0)});
 el.addEventListener('click',function(e){if(mov){e.stopPropagation();e.preventDefault();mov=false}},true);
 el.addEventListener('wheel',function(e){if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&el.scrollWidth>el.clientWidth){var max=el.scrollWidth-el.clientWidth;if((e.deltaY>0&&el.scrollLeft<max)||(e.deltaY<0&&el.scrollLeft>0)){el.scrollLeft+=e.deltaY;e.preventDefault()}}},{passive:false});
}

var CAP={k:'Capítulo 1 · 7 min',t:'La prisa: el gran enemigo de la vida espiritual',sub:'Una vida llena de actividades puede quedarse sin espacio para amar, disfrutar y estar con Dios.',
 idea:'La prisa crónica no es una dificultad secundaria de organización: es una forma de vida que erosiona la atención y vuelve cada vez más difícil crecer en amor, gozo, paz y comunión con Dios.',
 ps:['Una historia de Dallas Willard, transmitida por John Ortberg, dio forma a mi comprensión del problema. Ortberg, mientras servía en una iglesia muy exigente, le preguntó a Willard qué debía hacer para convertirse en la persona que anhelaba ser. La respuesta fue eliminar por completo la prisa. Ortberg quiso saber qué más debía hacer, pero Willard insistió en que ahí estaba el asunto decisivo: consideraba la prisa el mayor enemigo contemporáneo de la vida espiritual.',
  'No toda ocupación es dañina. Hay una manera sana de estar ocupado: dedicar el tiempo a responsabilidades y personas que realmente importan. Jesús mismo vivió rodeado de gente, necesidades, viajes y trabajo. El problema aparece cuando aceptamos más de lo que nuestra vida puede sostener y solo podemos cumplirlo corriendo de un lado al otro. La señal no es el número bruto de actividades, sino el estado permanente de urgencia.',
  'El primer fruto que la prisa destruye es el amor. Jesús colocó en el centro de la vida el amor a Dios y al prójimo, pero amar exige tiempo y presencia. Cuando intento sacar a mi familia de casa a toda velocidad o completar una lista imposible de tareas, dejo de tratar con paciencia a quienes más quiero. No es casual que Pablo comience su descripción del amor hablando de paciencia.',
  'Lo mismo ocurre con el gozo. Para disfrutar algo necesito estar realmente allí. Un momento puede ser hermoso, una conversación profunda o un regalo cotidiano, pero si mi mente está adelantada en la próxima obligación, la experiencia apenas me toca. La alegría se cultiva en el presente; la prisa nos obliga a vivir mentalmente en otro lugar.'],

var habla={on:false,v:1,ini:0,trans:0,ut:null,timer:null};
var PLAY='<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>',PAUSA='<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>';

function audioInit(){var pb=document.getElementById('play'),vel=document.getElementById('vel');pb.innerHTML=habla.on?PAUSA:PLAY;
 var total=textoAudio().split(/\s+/).length/2.5;function fmt(x){x=Math.max(0,Math.round(x));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')}
 function tick(){var el=habla.trans+(habla.on?(Date.now()-habla.ini)/1000*habla.v:0);var p=Math.min(1,el/total);var li=document.getElementById('linea');if(!li)return;li.style.width=(p*100)+'%';document.getElementById('tiempo').textContent=fmt((total-el)/habla.v)}
 tick();clearInterval(habla.timer);habla.timer=setInterval(tick,500);
 vel.onclick=function(){var vs=[1,1.25,1.5,.85],i=(vs.indexOf(habla.v)+1)%vs.length;habla.v=vs[i];vel.textContent='Escuchar capítulo · '+String(habla.v.toFixed(habla.v%1?2:1)).replace('.',',').replace(/0$/,'')+'×';if(habla.on){parar(true);hablar()}};
 pb.onclick=function(){if(habla.on){habla.trans+=(Date.now()-habla.ini)/1000*habla.v;habla.on=false;try{speechSynthesis.pause()}catch(e){}pb.innerHTML=PLAY}else if(habla.ut&&window.speechSynthesis&&speechSynthesis.paused){speechSynthesis.resume();habla.on=true;habla.ini=Date.now();pb.innerHTML=PAUSA}else hablar()};
 function hablar(){if(!('speechSynthesis' in window)){aviso('Este navegador no puede leer en voz alta aquí. En la app sonará el audio del capítulo.');return}
  var u=new SpeechSynthesisUtterance(textoAudio());u.lang='es-ES';u.rate=habla.v;var vs=speechSynthesis.getVoices().filter(function(v){return /^es/i.test(v.lang)});if(vs.length)u.voice=vs[0];
  u.onend=function(){habla.on=false;habla.trans=0;var p=document.getElementById('play');if(p)p.innerHTML=PLAY};
  u.onerror=function(){habla.on=false;var p=document.getElementById('play');if(p)p.innerHTML=PLAY;aviso('No se pudo reproducir la voz en este dispositivo.')};
  speechSynthesis.cancel();speechSynthesis.speak(u);habla.ut=u;habla.on=true;habla.ini=Date.now();pb.innerHTML=PAUSA;aviso('Escuchando con la voz del dispositivo (prototipo).')}
 function parar(guardar){if(guardar)habla.trans+=(Date.now()-habla.ini)/1000*habla.v;try{speechSynthesis.cancel()}catch(e){}habla.on=false;var p=document.getElementById('play');if(p)p.innerHTML=PLAY}
 audioInit.parar=parar;
}
