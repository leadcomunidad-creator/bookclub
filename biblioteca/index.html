<style>
/* App BOOKCLUB v3 · copiada del prototipo docs/rediseno/prototipo/app.html (vistas hoy, descubrir, biblioteca, disponibles, buscar, ideas). */
[hidden]{display:none!important}img{max-width:100%}
:root{
  --bg:#0b0c10;--surface:#15171e;--sunk:#101217;--line:#23262f;--line-2:#626a7c;
  --ink:#eceef3;--ink-2:#a6acb9;--ink-3:#8a90a0;
  --accent:#9ca0ff;--accent-soft:#1c1e3a;--on-accent:#0b0c10;
  --lumbre:#f2c879;--lumbre-soft:#2a2214;--on-lumbre:#17120a;--halo:rgba(242,200,121,.16);--estante:#2b251d;
  --lift:0 2px 4px rgba(0,0,0,.5),0 16px 30px -10px rgba(0,0,0,.7);
  --float:0 24px 60px -12px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06);
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-sm:6px;--r-md:10px;--r-lg:16px;--pill:99px;--ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f4f1ea;--surface:#fffdf8;--sunk:#eae5da;--line:#ddd6c8;--line-2:#8f8778;
  --ink:#17171a;--ink-2:#4a4b52;--ink-3:#62646c;--accent:#3b3fd8;--accent-soft:#e7e8fb;--on-accent:#fff;
  --lumbre:#8a5a0b;--lumbre-soft:#f6ebd3;--on-lumbre:#fff;--halo:rgba(138,90,11,.07);--estante:#cbbfa6;
  --lift:0 2px 4px rgba(20,22,28,.10),0 14px 28px -10px rgba(20,22,28,.28);
  --float:0 24px 60px -16px rgba(60,44,20,.35),0 0 0 1px rgba(23,23,26,.06);color-scheme:light}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:400 16px/1.55 var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;transition:background .25s,color .25s;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;text-wrap:balance;margin:0}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
html,body,*{scrollbar-width:none}
::-webkit-scrollbar{display:none;width:0;height:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.lead{font-size:1.05rem;color:var(--ink-2);max-width:62ch}
.meta{font-size:.82rem;color:var(--ink-3)}

/* Botones */
.btn{display:inline-flex;align-items:center;gap:.55rem;border-radius:var(--pill);padding:.8rem 1.4rem;font:600 .95rem/1.2 var(--sans);text-decoration:none;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--lift)}
.btn svg{transition:transform .15s}.btn:hover svg{transform:translateX(3px)}
.btn-2{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn-2:hover{border-color:var(--ink)}
.btn-sm{padding:.55rem 1rem;font-size:.88rem;gap:.4rem;white-space:nowrap}
.link{font:600 .95rem/1.2 var(--sans);color:var(--accent);text-decoration:none;border:0;border-bottom:1px solid transparent;padding:0 0 1px;background:none;cursor:pointer}
.link:hover{border-bottom-color:var(--accent)}
.cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.6rem}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{border-color:var(--ink);color:var(--ink)}

/* BarraApp */
.header{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--bg);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:12px 28px;min-height:64px;padding-block:8px}
.brand{display:flex;align-items:center;gap:.6rem;font:600 1.2rem/1 var(--serif);letter-spacing:.06em;color:var(--ink);flex-shrink:0;background:none;border:0;cursor:pointer;padding:0}
.mark{width:22px;height:22px;display:flex;align-items:flex-end;gap:2px}
.mark i{display:block;width:5px;background:var(--ink);border-radius:1px}
.mark i:nth-child(1){height:70%}.mark i:nth-child(2){height:100%;background:var(--accent)}.mark i:nth-child(3){height:55%}
.tabs-top{display:flex;gap:4px}
.tabs-top button{border:0;background:none;padding:.6rem 1rem;border-radius:var(--pill);font:600 .92rem/1 var(--sans);color:var(--ink-3);cursor:pointer}
.tabs-top button:hover{color:var(--ink)}
.tabs-top button[aria-current="page"]{color:var(--ink);background:var(--sunk)}
@media(max-width:1024px){.tabs-top{display:none}}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:700 13px/1 var(--sans);flex:none}
.menu-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 10px 0 5px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer}
.menu-btn .avatar{width:34px;height:34px}
.menu-btn svg{width:22px;height:22px}
.panel-menu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 72px);right:max(12px,env(safe-area-inset-right,0px));z-index:96;width:min(320px,calc(100vw - 24px));max-height:calc(100% - 96px);overflow:auto;padding:18px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--float);display:grid;gap:14px;animation:aparecer .2s var(--ease)}
.panel-menu .quien{display:flex;gap:12px;align-items:center;min-width:0}
.panel-menu .quien > div{min-width:0}
.panel-menu .quien b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel-menu .quien span{font-size:.82rem;color:var(--ink-3)}
.panel-menu hr{border:0;border-top:1px solid var(--line);margin:0}
.panel-menu h4{margin:0;font:700 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.panel-menu .lista{display:grid}
.panel-menu .lista a{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font:600 .82rem/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase}
.panel-menu .lista a::after{content:'↗';color:var(--ink-3);letter-spacing:0}
.panel-menu .fila-tema{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.panel-menu .salir{border:0;background:none;padding:4px 0;font:600 .95rem/1 var(--sans);color:var(--ink);text-align:left;cursor:pointer}

/* TabBar */
.tabbar{display:none}
@media(max-width:1024px){
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:grid;grid-template-columns:repeat(4,1fr);padding:8px max(8px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));background:var(--bg);border-top:1px solid var(--line)}
  body{padding-bottom:76px}
  .aviso{bottom:calc(88px + env(safe-area-inset-bottom,0px))!important}
}
.tabbar button{display:grid;justify-items:center;gap:6px;padding:8px 2px 4px;border:0;background:none;border-radius:12px;color:var(--ink-3);font:600 12.5px/1 var(--sans);cursor:pointer}
.tabbar button svg{width:26px;height:26px}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:700}

/* Insignias, etiquetas y portadas */
.insignia{display:inline-flex;align-items:center;gap:.35rem;border-radius:var(--r-sm);padding:.28rem .55rem;font:700 11px/1.3 var(--sans);letter-spacing:.1em;text-transform:uppercase;border:1px solid transparent;white-space:nowrap}
.insignia.gratis,.insignia.leido{color:var(--on-lumbre);background:var(--lumbre)}
.insignia.estado{color:var(--ink-2);background:var(--sunk)}
.tag{display:inline-block;font-size:.72rem;font-weight:500;color:var(--accent);background:var(--accent-soft);border-radius:var(--pill);padding:.2rem .65rem}
.book{display:flex;flex-direction:column;gap:.75rem;min-width:0;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.cover{position:relative;display:block;aspect-ratio:3/4;width:100%;max-width:100%;border-radius:3px 8px 8px 3px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.25),0 10px 22px -12px rgba(0,0,0,.6);transition:transform .3s var(--ease),box-shadow .3s;background:var(--sunk);container-type:inline-size}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cover::before{content:'';position:absolute;inset:0 auto 0 0;width:12px;z-index:1;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.1) 60%,transparent)}
.cover::after{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(160deg,rgba(255,255,255,.12),transparent 45%,rgba(0,0,0,.18));pointer-events:none}
.book:hover .cover{transform:translateY(-6px) rotate(-.4deg);box-shadow:var(--lift)}
.cover .insignia{position:absolute;top:10px;right:10px;z-index:2}
.gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:14% 12% 10% 16%;color:var(--gtx,#fff)}
.gen b{font:500 13cqi/1.12 var(--serif)}
.gen small{font:700 6cqi/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.book-title{display:block;font:500 1.02rem/1.2 var(--serif)}
.book-line{display:flex;justify-content:space-between;gap:.6rem;font-size:.82rem;color:var(--ink-3)}
.book-line b{color:var(--ink);font-weight:600}
.progreso{display:block;height:4px;border-radius:var(--r-sm);background:var(--line);overflow:hidden}
.progreso i{display:block;height:100%;background:var(--accent);border-radius:inherit}

/* Páginas */
.view{animation:entra .35s var(--ease);overflow-x:clip}
@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes aparecer{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes girar{from{transform:rotateY(-88deg) translateY(30px);box-shadow:none}to{transform:none}}
.pagina{padding-block:clamp(1.8rem,4vw,3rem) 4rem;display:grid;gap:2.6rem}
.top{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap}
.top h2{font-size:clamp(1.9rem,4vw,3rem);line-height:1.05;letter-spacing:-.02em;margin-top:10px}
.seg{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--line-2)}
.seg button{border:0;background:none;padding:.45rem .9rem;border-radius:999px;font:600 .82rem/1 var(--sans);color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.halo{position:absolute;pointer-events:none;background:radial-gradient(closest-side,var(--halo),transparent)}
.empieza{position:relative;display:grid;grid-template-columns:170px minmax(0,1fr);gap:1.6rem 2rem;align-items:center;padding:clamp(1.2rem,3vw,2rem);border-radius:var(--r-lg);background:var(--lumbre-soft);overflow:hidden}
.empieza .halo{inset:-60% 40% -20% -30%}
.empieza > :not(.halo){position:relative;min-width:0}
.empieza h3{font:500 clamp(1.8rem,3.4vw,2.4rem)/1.05 var(--serif);margin:12px 0 10px}
.empieza .cta-row{margin-top:18px}
.pasillo{display:grid;gap:1rem}
.pasillo-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;border-top:1px solid var(--line);padding-top:1rem}
.pasillo-head h3{font:500 30px/1.1 var(--serif);letter-spacing:-.01em}
.pasillo-head .sub{display:block;font-size:.82rem;color:var(--ink-3);margin-top:4px}
.pasillo-head > span{font-size:.82rem;color:var(--ink-3);white-space:nowrap}
.riel{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,180px);gap:1.4rem;overflow-x:auto;padding:8px 2px 12px;scroll-snap-type:x proximity;cursor:grab;-webkit-user-select:none;user-select:none}
.riel.arrastra{cursor:grabbing;scroll-snap-type:none}
.riel.arrastra *{pointer-events:none}
.riel > *{scroll-snap-align:start}
.riel img{-webkit-user-drag:none}
.ver-todo{border:0;background:none;font:600 .85rem/1 var(--sans);color:var(--accent);cursor:pointer;padding:6px 0;white-space:nowrap;display:inline-flex;gap:.4rem;align-items:center}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:2rem 1.2rem}
.volver{border:0;background:none;padding:0;font:600 .88rem/1 var(--sans);color:var(--accent);cursor:pointer;display:inline-flex;gap:.4rem;align-items:center}
.bib-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lupa-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}

/* Buscar */
.buscador{display:flex;align-items:center;gap:.6rem;padding:0 16px;min-height:52px;border-radius:var(--pill);border:1px solid var(--line-2);background:var(--surface)}
.buscador input{flex:1;min-width:0;border:0;background:none;font:500 1rem var(--sans);color:var(--ink);outline:none}
.buscador input::-webkit-search-cancel-button{display:none}
.buscador:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.filtros{display:flex;gap:8px;overflow-x:auto}
.filtros .chip{flex:none}
.resumen{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem .9rem;border-radius:var(--pill);border:1px solid var(--line-2);background:transparent;font:600 .85rem/1 var(--sans);color:var(--ink-2);cursor:pointer}
.chip b{font-variant-numeric:tabular-nums;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip[aria-pressed="true"] b{color:var(--on-accent)}

/* Mi estante */
.mueble{position:relative;border-radius:var(--r-lg);background:var(--sunk);overflow:hidden;padding:0 clamp(12px,3vw,32px) 8px}
.grupo{position:relative;padding-top:22px}
.grupo + .grupo{margin-top:6px}
.grupo-head{position:relative;display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:14px}
.grupo-head h3{font:500 1.35rem/1.1 var(--serif)}
.grupo-head span{font-size:.82rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.grupo.lit{padding-top:70px}
.lampara{position:absolute;left:50%;top:0;transform:translateX(-50%);width:120px;height:46px}
.lampara .lc{stroke:var(--ink-3)}.lampara .ls{fill:var(--ink-3)}.lampara .lb{fill:var(--lumbre)}
.grupo.lit .lomos{justify-content:center}
.grupo.lit .halo{inset:-20% 0 30%}
.repisa{position:relative}
.lomos{display:flex;align-items:flex-end;gap:7px;min-height:var(--rh,230px);padding:0 4px}
.tabla{height:12px;margin:0 calc(clamp(12px,3vw,32px)*-1) 18px;background:var(--estante);box-shadow:inset 0 2px 0 var(--ink-3),0 18px 30px -12px rgba(0,0,0,.6)}
.lomo{position:relative;flex:none;height:calc(var(--h)*var(--k,1)*1px);width:calc(var(--w)*var(--k,1)*1px);border:0;padding:0;border-radius:3px 3px 1px 1px;cursor:pointer;overflow:hidden;transform-origin:50% 100%;transition:transform .45s var(--ease),filter .3s;box-shadow:inset -3px 0 6px rgba(0,0,0,.25)}
.lomo::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.18),transparent 25%,transparent 75%,rgba(0,0,0,.25))}
.lomo span{position:absolute;inset:10px 0;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font:500 .88rem/1 var(--serif);letter-spacing:.02em;white-space:nowrap;overflow:hidden;color:var(--tx,#fff)}
.lomo:hover{transform:translateY(-10px)}
.cinta{position:absolute;left:50%;top:-1px;width:8px;height:22px;transform:translateX(-50%);background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.lomo .sello{position:absolute;left:0;right:0;bottom:12%;height:5px;background:var(--lumbre);opacity:.9}
.lomo .sello + span{inset:10px 0 calc(12% + 12px)}
.lomo.leido{filter:saturate(.8)}
.lomo.alzado{transform:translateY(-26px) rotate(-2deg)!important;filter:none!important;z-index:2}
.mueble.atenua .lomo:not(.alzado){filter:brightness(.5) saturate(.6)}
.vacio-grupo{padding:24px 0 30px;color:var(--ink-3);font:italic 1rem var(--serif)}
.vacio{padding:3rem 1.5rem;text-align:center;display:grid;gap:1rem;justify-items:center;color:var(--ink-2);border-radius:var(--r-lg);background:var(--sunk)}
.vacio h3{font-size:1.6rem;color:var(--ink)}

/* El libro en la mano */
.mano{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(5,6,8,.88);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:aparecer .25s var(--ease)}
.mano-in{position:relative;display:grid;grid-template-columns:minmax(0,300px) minmax(0,320px);gap:clamp(20px,4vw,44px);align-items:center;max-width:100%;perspective:1400px}
.mano .cover{width:100%;transform-origin:0 50%;animation:girar .75s var(--ease) both;box-shadow:0 30px 70px -20px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.05)}
.mano .halo-mano{position:absolute;inset:-30% -20%;pointer-events:none;background:radial-gradient(closest-side,rgba(242,200,121,.16),transparent)}
.mano .info{position:relative;display:grid;gap:.7rem;align-content:center;animation:aparecer .45s .3s var(--ease) both;color:#eceef3}
.mano .info h3{font:500 clamp(1.6rem,3.4vw,2.3rem)/1.08 var(--serif)}
.mano .info .autor{font-size:.92rem;color:#a6acb9}
.mano .estado-linea{display:flex;align-items:center;gap:.6rem;font-size:.85rem;color:#a6acb9;font-variant-numeric:tabular-nums}
.mano .estado-linea .progreso{flex:1;background:rgba(255,255,255,.14)}
.mano .estado-linea .progreso i{background:#9ca0ff}
.mano .acciones{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem 1.2rem;margin-top:.4rem}
.mano .btn{background:#9ca0ff;border-color:#9ca0ff;color:#0b0c10}
.mano .link{color:#c9cbff}.mano .link:hover{border-bottom-color:#c9cbff}
.mano .link.quitar{color:#a6acb9;font-weight:500}
.mano .cerrar{position:absolute;top:-6px;right:-6px;background:rgba(21,23,30,.9);border-color:#626a7c;color:#eceef3}
.mano .insignia.estado{background:rgba(255,255,255,.1);color:#d4d7e0}
.mano .insignia.leido{background:#f2c879;color:#17120a}
@media(max-width:700px){
  .mano{place-items:end center;padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}

<script>
(function(){
'use strict';
/* ═══ Constantes ═══ */
var A='<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var LAMP='<svg class="lampara" viewBox="0 0 120 46" aria-hidden="true"><path class="lc" d="M60 0v16" stroke-width="2"/><path class="ls" d="M36 34 L48 16 H72 L84 34 Z"/><ellipse class="lb" cx="60" cy="36" rx="9" ry="5"/></svg>';
var MARCADOR='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12v17l-6-4.2-6 4.2z"/></svg>';
var EXP={mentalidad:['Mentalidad','Identidad, sanidad y renovación',['identidad','sanidad','renovacion']],capacidad:['Capacidad','Inteligencia espiritual, emocional y física',['espiritual','emocional','fisica']],habilidad:['Habilidad','Personal, relacional y vocacional',['personal','relacional','vocacional']]};

var ENTRADA='jesus-es';
var NOM={leyendo:'Leyendo',porleer:'Por leer',leido:'Leídos'};
var EST1={leyendo:'Leyendo',porleer:'Por leer',leido:'Leído'};
var ESTADOS=['leyendo','porleer','leido'];
var LIB_KEY='bookclub-biblioteca',IDEAS_KEY='bookclub-ideas',VISTA_KEY='bc-vista',COMP_KEY='bookclub-compromiso';
/* Libros cuyo archivo no coincide con la clave de avance que guarda su propia página (igual que antes) */

/* ═══ Utilidades ═══ */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function hex2rgb(h){h=String(h||'').replace('#','');if(!/^[0-9a-f]{6}$/i.test(h))return null;return[0,2,4].map(function(i){return parseInt(h.slice(i,i+2),16)})}

/* Fondo oscuro con contraste ≥ 4.5:1 para texto blanco */
function fondoOscuro(hex){var c=hex2rgb(hex)||[40,40,44],f=1;for(var i=0;i<20;i++){var h='#'+c.map(function(v){return('0'+Math.round(v*f).toString(16)).slice(-2)}).join('');if(1.05/(luma(h)+.05)>=4.6)return h;f*=.9}return '#1d1a19'}
function hm(min){var h=Math.floor(min/60),m=Math.round(min%60);return(h?h+' h ':'')+(m?m+' min':'')}
function hoyISO(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
var app=document.getElementById('app'),root=document.documentElement;

/* Aviso: abajo al centro, desaparece a los 6 segundos */

 el.innerHTML='<span class="punto" aria-hidden="true"></span>';el.appendChild(document.createTextNode(msg));el.hidden=false;clearTimeout(avisoT);avisoT=setTimeout(function(){el.hidden=true},6000)}

/* ═══ Cuenta ═══ */
function usuario(){return window.BookclubSync&&window.BookclubSync.getUser?window.BookclubSync.getUser():null}
function conAcceso(){return !!(window.BookclubSync&&window.BookclubSync.isAuthorized&&window.BookclubSync.isAuthorized())}
function nombre(){var u=usuario();if(!u)return '';return(u.displayName||'').trim()||(u.email||'').split('@')[0]}
function primerNombre(){return nombre().split(/\s+/)[0]||''}
function iniciales(){var n=nombre();if(!n)return '';var p=n.split(/\s+/).filter(Boolean);return(p.length>1?p[0][0]+p[1][0]:n.slice(0,2)).toUpperCase()}
function pintarCuenta(){var a=document.getElementById('avatar');a.textContent=iniciales()||'·';document.getElementById('menu-btn').setAttribute('aria-label','Abrir menú'+(primerNombre()?' de '+primerNombre():''))}

/* ═══ Catálogo ═══ */
var CAT=[],L=[],B={};
function slugDe(l){if(l.slug)return l.slug;var b=(l.archivo||'').split('/').pop().replace(/\.html?$/,'').replace(/-json(-piloto)?$/,'');return b}
function tipoDe(l){var t=norm(l.tipo||l.formato||'');if(t==='curso'||t==='libro'||t==='resumen')return t;if(t==='libro completo'||t==='completo')return 'libro';var a=norm(l.archivo||'');if(/(^|[\/_-])cursos?([\/_.-]|$)/.test(a))return 'curso';if(/(^|[\/_-])completos?([\/_.-]|$)/.test(a))return 'libro';return 'resumen'}
function normal(l){
  var c1=l.color_portada_inicio||'#2b2926',c2=l.color_portada_fin||c1,min=+l.tiempo_lectura_min||+l.tiempo_lectura_total_min||60,cap=+l.capitulos||8;
  var clara=(luma(c1)+luma(c2))/2>.46,s=slugDe(l),exp=l.categoria||l.expedicion,subk=l.subcategoria||l.sub_expedicion;
  var i1=l.idea_1min||null;
  return {id:l.archivo,slug:s,raw:l,t:l.titulo,a:l.autor||'',min:min,cap:cap,c1:c1,c2:c2,tx:clara?(l.color_acento||'#18212a'):'#fff',
    exp:exp,subk:subk,sub:SUB[subk]||'',d:l.descripcion||l.preview_subtitulo||l.subtitulo||'',img:l.preview_imagen||'',temas:l.temas||[],
    tipo:tipoDe(l),privado:tipoDe(l)==='libro',acento:l.color_acento||'#3b3fd8',
    idea:{titular:(i1&&i1.titular)||l.preview_subtitulo||l.subtitulo||l.titulo,texto:(i1&&i1.texto)||l.descripcion||'',fondo:(i1&&i1.fondo)||fondoOscuro(l.color_acento||c2)},
    h:Math.round(140+min*.85),w:Math.round(30+cap*1.8)};

  L=ordenar(CAT.filter(function(l){return l&&l.titulo&&l.archivo&&(tipoDe(l)!=='libro'||conAcceso())}).map(normal));

}
function entrada(){for(var i=0;i<L.length;i++)if(L[i].slug===ENTRADA)return L[i];return L[0]}

/* ═══ Mi estante: mismos estados y claves que la app anterior ═══ */
var lib={},progMap={};
function loadLib(){lib={};try{var j=JSON.parse(lsGet(LIB_KEY));if(j&&typeof j==='object')Object.keys(j).forEach(function(k){var c=j[k];if(c&&(EST1[c.e]||c.e==='no'))lib[k]={e:c.e,t:+c.t||0}})}catch(e){}}
function saveLib(){lsSet(LIB_KEY,JSON.stringify(lib))}
function stOf(b){var c=lib[b.id];return c&&EST1[c.e]?c.e:null}
function clavesProg(l){if(l.clave_progreso)return[l.clave_progreso];var b=(l.archivo||'').split('/').pop().replace(/\.html?$/,''),s=SLUG_PROGRESO[b]||b;return[tipoDe(l)==='curso'?'bookclub-'+s+'-curso-progreso':'bookclub-'+s+'-progreso']}
function leerProg(b){
  var l=b.raw,ks=clavesProg(l),j=null;
  for(var i=0;i<ks.length&&!j;i++){try{var x=JSON.parse(lsGet(ks[i]));if(x&&typeof x==='object'&&x.p)j=x}catch(e){}}

function pct(b){var p=progMap[b.id];return p&&p.pct!=null?p.pct:0}

function leerIdeas(){try{var x=JSON.parse(lsGet(IDEAS_KEY));return Array.isArray(x)?x.filter(function(i){return i&&i.q&&!i.borrada}):[]}catch(e){return[]}}

/* ═══ Piezas ═══ */

function arrastre(el){if(!el||el._arr)return;el._arr=1;var x0,s0,mov=false,down=false;
 el.addEventListener('pointerdown',function(e){if(e.pointerType!=='mouse')return;down=true;mov=false;x0=e.clientX;s0=el.scrollLeft});
 window.addEventListener('pointermove',function(e){if(!down)return;var dx=e.clientX-x0;if(Math.abs(dx)>4){mov=true;el.classList.add('arrastra')}if(mov)el.scrollLeft=s0-dx});
 window.addEventListener('pointerup',function(){if(!down)return;down=false;setTimeout(function(){el.classList.remove('arrastra')},0)});
 el.addEventListener('click',function(e){if(mov){e.stopPropagation();e.preventDefault();mov=false}},true);
 el.addEventListener('wheel',function(e){if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&el.scrollWidth>el.clientWidth){var max=el.scrollWidth-el.clientWidth;if((e.deltaY>0&&el.scrollLeft<max)||(e.deltaY<0&&el.scrollLeft>0)){el.scrollLeft+=e.deltaY;e.preventDefault()}}},{passive:false});
}

    var i=pags.indexOf(pr.ult);if(i<0)i=0;else if(pr.r>=.95&&i<pags.length-1)i++;

    function paso(id){var d=doc.getElementById(id),p=d&&d.querySelector('.libro-header-paso');return p?p.textContent.trim():''}
    var id=pags[i],prac=null;
    for(var k=i;k<pags.length&&!prac;k++){var d=doc.getElementById(pags[k]),a=d&&d.querySelector('.accion-text');if(a&&a.textContent.trim())prac={texto:a.textContent.trim(),pag:pags[k],paso:paso(pags[k])}}

  return '<section class="idea-libro"><div class="idea-libro-head">'+(b?'<span class="mini">'+portada(b)+'</span>':'')+'<div><b>'+esc(b?b.t:(g[0].titulo||'Libro'))+'</b><p class="meta">'+g.length+(g.length===1?' idea':' ideas')+'</p></div></div>'+
  g.map(function(x){var i=xs.indexOf(x);return '<article class="cita-card"><q>'+esc(x.q)+'</q>'+(x.n?'<p class="nota">'+esc(x.n)+'</p>':'')+'<div class="pie"><span>'+esc(x.pag||'')+'</span><span style="display:flex;gap:18px"><button type="button" data-borrar="'+i+'" style="color:var(--ink-3)">Borrar</button><button type="button" data-compartir="'+i+'">Compartir</button></span></div></article>'}).join('')+'</section>'}).join('')+'</div></div>';

}
